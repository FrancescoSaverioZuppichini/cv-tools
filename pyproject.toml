[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-tools"
version = "0.1.0"
description = "Small, local computer-vision CLIs with optimized GPU inference"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.11,<2.12",
  "torchvision>=0.26,<0.27",
  "transformers==5.20.1",
  "opencv-python-headless>=4.11,<5",
  "Pillow>=10",
  "numpy>=2,<3",
]

[project.optional-dependencies]
tensorrt = ["tensorrt-cu12==10.16.1.11", "onnx==1.20.1", "onnxscript==0.7.2", "onnx_ir==1.0.0"]

[project.scripts]
cv-tools = "cv_tools.__main__:main"
cv-sapiens2 = "cv_tools.sapiens2.cli:main"

[tool.setuptools.packages.find]
include = ["cv_tools*"]

[tool.setuptools.package-data]
"cv_tools.sapiens2" = ["*.json"]
